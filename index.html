<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felipe Seiji - 3D Interactive Experience</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d1117;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #info {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #00F5D4;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
    }
  </style>
</head>
<body>
  <div id="info">🖱️ Clique e arraste para rodar o modelo 3D | Scroll para zoom</div>

  <!-- Imports de Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 1. Cenário, Câmara e Renderizador
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. Controles de Rotação com o Rato (OrbitControls)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 3. Luzes Neon
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0x00F5D4, 2, 50);
    pointLight1.position.set(5, 5, 5);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x7928CA, 2, 50);
    pointLight2.position.set(-5, -5, -5);
    scene.add(pointLight2);

    // 4. Objeto 3D Interativo (Icosaedro / Core Backend)
    const geometry = new THREE.IcosahedronGeometry(1.8, 0);
    const material = new THREE.MeshStandardMaterial({
      color: 0x111827,
      roughness: 0.2,
      metalness: 0.8,
      wireframe: true
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Núcleo luminoso interno
    const coreGeo = new THREE.SphereGeometry(1, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x00F5D4 });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    scene.add(coreMesh);

    // 5. Animação de Loop
    function animate() {
      requestAnimationFrame(animate);

      mesh.rotation.x += 0.005;
      mesh.rotation.y += 0.005;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Interação de Clique no Objeto
    window.addEventListener('click', () => {
      coreMat.color.setHex(Math.random() * 0xffffff);
    });

    // Ajuste de Redimensionamento da Janela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
